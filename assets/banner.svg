<svg width="100%" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Progenitor Protocol">
  <title>Progenitor Protocol</title>
  <desc>A self-bootstrapping capability layer for AI coding agents — a two-color DNA double helix beside the wordmark on a dark backdrop.</desc>
  <defs>
